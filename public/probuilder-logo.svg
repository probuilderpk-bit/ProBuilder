<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <!-- Dark Vignette Spotlight Background matching the original logo image -->
    <radialGradient id="pbVignette" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#24242B" stop-opacity="0.95" />
      <stop offset="28%" stop-color="#141418" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#08080A" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <!-- Subtle Red Atmosphere behind the B letter -->
    <radialGradient id="pbCoreGlow" cx="414" cy="212" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B81118" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#B81118" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#B81118" stop-opacity="0" />
    </radialGradient>

    <!-- Sparkle Silver Gradient -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C0C2CC" />
      <stop offset="100%" stop-color="#848694" />
    </radialGradient>
  </defs>

  <!-- Base Pitch Black Canvas -->
  <rect width="960" height="540" fill="#000000" />
  <!-- Vignette Spotlight -->
  <rect width="960" height="540" fill="url(#pbVignette)" />

  <!-- Core Red Glow -->
  <circle cx="414" cy="212" r="140" fill="url(#pbCoreGlow)" />

  <!-- BACK LAYER OF ORBITAL RING (passes behind the top of letter B) -->
  <g transform="translate(414, 212) rotate(-47)">
    <!-- Inner smooth ring (back arc: from angle -50deg to 130deg) -->
    <path d="M 50.1 -25.2 A 78 33 0 0 1 -50.1 25.2" 
          stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.5" stroke-linecap="round" />
    <!-- Outer segmented tech ring (back arc) -->
    <path d="M 60.4 -30.6 A 94 40 0 0 1 -60.4 30.6" 
          stroke="#FFFFFF" stroke-width="4.2" stroke-dasharray="24 10 18 10 28 10" stroke-opacity="0.55" stroke-linecap="round" />
  </g>

  <!-- WORDMARK: ProBuilder -->
  <text x="480" y="258" text-anchor="middle" font-family="'Outfit', 'Montserrat', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="138" letter-spacing="-2px">
    <tspan fill="#B81118">ProB</tspan><tspan fill="#FFFFFF">uilder</tspan>
  </text>

  <!-- FRONT LAYER OF ORBITAL RING (passes in front of the lower stem of B) -->
  <g transform="translate(414, 212) rotate(-47)">
    <!-- Inner smooth ring (front arc: from angle 130deg to 310deg) -->
    <path d="M -50.1 25.2 A 78 33 0 0 1 50.1 -25.2" 
          stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
    <!-- Outer segmented tech ring (front arc: distinct solid white blocks) -->
    <path d="M -60.4 30.6 A 94 40 0 0 1 60.4 -30.6" 
          stroke="#FFFFFF" stroke-width="5" stroke-dasharray="28 10 20 9 34 10 22 9" stroke-linecap="round" />

    <!-- Radial connector ticks between inner and outer ring -->
    <line x1="-78" y1="0" x2="-94" y2="0" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-67.5" y1="16.5" x2="-81.4" y2="20" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-39" y1="28.5" x2="-47" y2="34.6" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- TAGLINE: DEVELOPMENT • TEACHING • GLOBAL REACH -->
  <text x="480" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif" font-weight="700" font-size="21" fill="#FFFFFF" letter-spacing="5.5px">
    DEVELOPMENT • TEACHING • GLOBAL REACH
  </text>

  <!-- 4-POINT STAR SPARKLE in bottom right corner -->
  <g transform="translate(876, 442)">
    <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="url(#sparkleGlow)" opacity="0.85" />
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>
</svg>
